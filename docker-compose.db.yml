services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kiwi_podcast
      POSTGRES_USER: kiwi_podcast
      POSTGRES_PASSWORD: kiwi_podcast
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiwi_podcast -d kiwi_podcast"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
