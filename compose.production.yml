name: kiwi-podcast

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kiwi_podcast}
      POSTGRES_USER: ${POSTGRES_USER:-kiwi_podcast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
      target: migrate
    env_file:
      - ${KIWI_PODCAST_API_ENV_FILE:-./deploy/api.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kiwi_podcast}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kiwi_podcast}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
      target: runtime
    env_file:
      - ${KIWI_PODCAST_API_ENV_FILE:-./deploy/api.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kiwi_podcast}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kiwi_podcast}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    init: true
    restart: unless-stopped
    logging: *default-logging

  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
      target: runtime
      args:
        VITE_PODCAST_API_BASE: /
    env_file:
      - ${KIWI_PODCAST_CADDY_ENV_FILE:-./deploy/caddy.env}
    ports:
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:

