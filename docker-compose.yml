services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kiwi_podcast
      POSTGRES_USER: kiwi_podcast
      POSTGRES_PASSWORD: kiwi_podcast
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiwi_podcast -d kiwi_podcast"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kiwi_podcast
      MINIO_ROOT_PASSWORD: kiwi_podcast_dev_secret
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
